services:
  - type: web
    name: driverguard-api
    runtime: node
    plan: free
    rootDir: Firebase/functions
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: FIREBASE_PROJECT_ID
        value: driverguard-854e5
      - key: FIREBASE_STORAGE_BUCKET
        value: driverguard-854e5.firebasestorage.app
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_DOCUMENT_BUCKET
        value: driver-documents
